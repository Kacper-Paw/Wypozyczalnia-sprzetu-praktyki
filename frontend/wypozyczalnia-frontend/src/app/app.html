<h1>Wypożyczalnia sprzętu</h1>

<h2>Dostępny sprzęt:</h2>

<ul>
  @for (sprzet of sprzety; track sprzet.id) {
    <li>
      <strong>{{ sprzet.nazwa }}</strong><br>
      {{ sprzet.opis }}<br>
      Kategoria: {{ sprzet.kategoria }}<br>

      @if (sprzet.dostepnosc) {
        <span>Dostępny</span>
      } @else {
        <span>Niedostępny</span>
      }
    </li>
  }
</ul>
